<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Alunos - Sistema Acadêmico</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/dados.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <header class="cabecalho"><h1 id="titulo-sistema">SISTEMA DE GERENCIAMENTO ACADÊMICO</h1><span>Área Acadêmica</span></header>
  <nav><ul>
    <li><a href="index.html">Dashboard</a></li><li><a href="alunos.html">Alunos</a></li>
    <li><a href="cursos.html">Cursos</a></li><li><a href="matriculas.html">Matrículas</a></li>
    <li><a href="usuarios.html">Usuários</a></li>
  </ul></nav>
  <main>
    <section class="painel">
      <h2>Cadastro de Alunos</h2>
      <form id="form-aluno">
        <div class="form-grid">
          <div><label for="nome">Nome</label><input type="text" minlength="3" id="nome" name="nome" required></div>
          <div><label for="cpf">CPF</label><input type="text" id="cpf" name="cpf" placeholder="000.000.000-00"></div>
          <div><label for="date">Data de Nascimento</label><input type="date" id="date" name="date"></div>
          <div><label for="email">E-mail</label><input type="email" id="email" name="email" placeholder="exemplo@dominio.com" required></div>
          <div><label for="telefone">Telefone</label><input type="tel" id="telefone" name="telefone" placeholder="00 00000-0000"></div>
          <div><label for="cidade">Cidade</label><input type="text" id="cidade" name="cidade"></div>
          <div><label for="estado">Estado</label><input type="text" id="estado" name="estado" maxlength="2" placeholder="MT"></div>
          <div><label for="curso">Curso</label><select id="curso" name="curso" required></select></div>
          <div><label for="status">Status</label><select id="status" name="status" required><option value="ativo">Ativo</option><option value="inativo">Inativo</option></select></div>
        </div>
        <div class="acoes"><a class="botao botao-secundario" href="alunos.html">Voltar</a><button type="reset" class="botao-secundario">Limpar</button><button type="submit">Cadastrar aluno</button></div>
      </form>
    </section>
  </main>
  <footer><p>© 2026 Sistema de Gerenciamento Acadêmico. Todos os direitos reservados.</p></footer>
</body>
</html>
