<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Dashboard</title>
</head>
<body>

  <header>
      <h1>SISTEMA DE GERENCIAMENTO ACADÊMICO</h1>
  </header>

             <nav>
                  <ul>
                      <li><a href="index.html">Dashboard</a></li>
                      <li><a href="alunos.html">Alunos</a></li>
                      <li><a href="cursos.html">Cursos</a></li>
                      <li><a href="matriculas.html">Matriculas</a></li>
                      <li><a href="usuarios.html">Usuários</a></li>
                  </ul>
              </nav>

<main>
    <section>
      <h2>Cadastro de Alunos</h2>

        <form>
            <fieldset>
                <legend>Dados Pessoais</legend>

                <label for="nome">Nome</label>
                <input type="text" minlength="3" id="nome" name="nome"maxlength="100" required>

                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" placeholder="000.000.000-00" required>

                <label for="dataNascimento">Data de Nascimento</label>
                <input type="dataNascimento" id="dataNascimento" name="dataNascimento" required>

                <label for="email">E-mail</label>
                <input type="email" placeholder="exemplo@dominio.com" id="email" name="email" required>

                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" pattern="[0-9]{2} [0-9]{5}-[0-9]{4}" placeholder="00 00000-0000">
            </fieldset>

            <fieldset>
                <legend>Endereço</legend>
                <label for="cidade">Cidade</label>
                <input type="text" id="cidade" name="cidade">

                <label for="estado">Estado</label>
                <input type="text" placeholder="ex: SP" pattern="[A-Z]{2}" id="estado" name="estado">
            </fieldset>

            <fieldset>
                <legend>Situação Acadêmica</legend>
                <select
                   id="status"
                   name="status"
                   required>
                   <option value="">Selecione</option>
                   <option value="ativo">Ativo</option>
                   <option value="inativo">Inativo</option>
                   <option value="trancado">Trancado</option>
                </select>
            </fieldset>

            <button type="submit">Salvar</button>
            <button type="reset" class="botao-secundario">Limpar</button>
        </form>

        <p><a href="alunos.html">Voltar para Alunos</a></p>
    </section>
</main>

<footer>
    <p>© 2026 Sistema de Gerenciamento Acadêmico. Todos os direitos reservados.</p>
</footer>

</body>
</html>
