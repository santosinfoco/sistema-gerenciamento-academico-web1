<!DOCTYPE html>

<section>
    <h2>Filtrar Alunos</h2>
    <label for="busca">Pesquisar por nome:</label>
    <input id="busca" type="search" placeholder="Digite o nome">

    <label for="filtro-status">Status:</label>
    <select id="filtro-status">
        <option value="">Todos</option>
        <option value="ativo">Ativo</option>
        <option value="inativo">Inativo</option>
    </select>
</section>

<!-- Área de Detalhes do Aluno -->
<section id="detalhes-aluno" style="margin: 20px 0; padding: 15px; border: 1px solid #ccc;">
    <h2>Detalhes do Aluno</h2>
    <p><strong>Nome:</strong> <span id="detalhe-nome">-</span></p>
    <p><strong>Curso:</strong> <span id="detalhe-curso">-</span></p>
    <p><strong>Status:</strong> <span id="detalhe-status">-</span></p>
</section>

<hr>
<hr>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lista de Alunos - Sistema Acadêmico</title>
</head>
<body>
    <h1>Lista de Alunos</h1>

    <!-- Recipiente onde o JavaScript vai injetar os cartões dos alunos -->
    <div id="lista-alunos" class="lista-grid"></div>

    <!-- Scripts necessários -->
    <script src="js/dados.js"></script>
    <script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lista de Alunos - Sistema Acadêmico</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Gerenciamento de Alunos</h1>

    <!-- Formulário de Cadastro -->
    <section>
        <h2>Cadastrar Novo Aluno</h2>
        <form id="form-aluno">
            <input type="text" id="nome-aluno" placeholder="Nome do Aluno" required>
            <input type="text" id="curso-aluno" placeholder="Curso" required>
            <select id="status-aluno">
                <option value="ativo">Ativo</option>
                <option value="inativo">Inativo</option>
            </select>
            <button type="submit">Adicionar Aluno</button>
        </form>
    </section>

    <hr>

    <!-- Recipiente onde o JavaScript vai injetar os cartões -->
    <div id="lista-alunos" class="lista-grid"></div>

    <!-- Scripts necessários -->
    <script src="js/dados.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
