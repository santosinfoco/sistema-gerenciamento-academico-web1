    <title>Dashboard</title>

<body>
  <header>
      <h1>SISTEMA DE GERENCIAMENTO ACADÊMICO</h1>
  </header>

             <nav>
                  <ul>
                      <li><a href="index.html">Dashboard</a></li>

                  </ul>
              </nav>

<main>
    <section>
        <h2>Cadastro de Curso</h2>

        <form>
            <fieldset>
                <legend>Dados do Curso</legend>

                <label for="codigo">Código</label>
                <input type="text" minlength="3" id="codigo" name="codigo" required>

                <label for="nome">Nome</label>
                <input type="text" minlength="3" id="nome" name="nome" required>

                <label for="descricao">Descrição</label>
                <input type="text" id="descricao" name="descricao" required>

                <label for="cargaHoraria">Carga Horária</label>
                <input type="number" id="cargaHoraria" name="cargaHoraria" required>

                <label for="duracaoemSemestre">Duração em Semestres</label>
                <input type="number" id="duracaoemSemestre" name="duracaoemSemestre" required>

                <label for="modalidade">Modalidade</label>
                <select id="modalidade" name="modalidade" required>
                   <option value="">Selecione</option>
                   <option value="presencial">Presencial</option>
                   <option value="semipresencial">Semipresencial</option>
                   <option value="ead">EAD</option>
                </select>

                <label for="status">Status</label>
                <select id="status" name="status" required>
                   <option value="">Selecione</option>
                   <option value="ativo">Ativo</option>
                   <option value="inativo">Inativo</option>
                </select>
             </fieldset>

             <button type="submit">Salvar</button>
             <button type="reset" class="botao-secundario">Limpar</button>
        </form>
    </section>
</main>

<footer>

</footer>

</body>
</html>
