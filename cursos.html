<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lista de Cursos - Sistema Acadêmico</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Lista de Cursos</h1>

    <!-- Recipiente onde o JavaScript vai injetar os cartões dos cursos -->
    <div id="lista-cursos" class="lista-grid"></div>

    <!-- Scripts necessários -->
    <script src="js/dados.js"></script>
    <script src="js/app.js"></script>
</body>
</html>

<section>
    <h2>Cadastrar Novo Curso</h2>
    <form id="form-curso">
        <input type="text" id="nome-curso" placeholder="Nome do Curso" required>
        <input type="text" id="carga-curso" placeholder="Duração / Carga Horária" required>
        <button type="submit">Adicionar Curso</button>
    </form>
</section>

<hr>

<div id="lista-cursos" class="lista-grid"></div>

<script src="js/dados.js"></script>
<script src="js/app.js"></script>
