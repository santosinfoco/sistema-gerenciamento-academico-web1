<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Dashboard</title>
</head>
<body>

<h1>SISTEMA DE GERENCIAMENTO ACADÊMICO</h1>
       <nav>
            <ul>
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="alunos.html">Alunos</a></li>
                <li><a href="cursos.html">Cursos</a></li>
                <li><a href="matrículas.html">Matriculas</a></li>
                <li><a href="usuários.html">Usuários</a></li>
            </ul>
        </nav>

<main>
    <section>
        <form>
            <fieldset>
                <legend><h2>Cadastro de Alunos</h2></legend>
                <label for="aluno">Aluno</label>
                <input type="text" minlength="3" id="aluno" name="aluno" required>

                <label for="curso">Curso</label>
                <input type="text" id="curso" name="curso" required>

                <label for="date">Data da matrícula</label>
                <input type="date" id="date" name="date" required>

                <label for="Semestre">Semestre de Ingresso</label>
                <input type="number" id="Semestre" name="Semestre" required>

                <label for="Matricula">Número da Matrícula</label>
                <input type="number" id="Matricula" name="Matricula" required>

                <label for="status">Status</label>
                <input type="text" id="status" name="status" required>
            </fieldset>

            <button type="reset">Limpar</button>
            <button type="submit">Cadastrar</button>
        </form>
    </section>
</main>

<footer>
    <p>© 2026 Sistema de Gerenciamento Acadêmico. Todos os direitos reservados.</p>
</footer>
</body>
</html>
