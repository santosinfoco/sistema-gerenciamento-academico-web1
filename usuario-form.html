<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Dashboard</title>
</head>
<body>

  <header>
      <h1>SISTEMA DE GERENCIAMENTO ACADÊMICO</h1>
             <nav>
                  <ul>
                      <li><a href="index.html">Dashboard</a></li>
                      <li><a href="alunos.html">Alunos</a></li>
                      <li><a href="cursos.html">Cursos</a></li>
                      <li><a href="matriculas.html">Matriculas</a></li>
                      <li><a href="usuarios.html">Usuários</a></li>
                  </ul>
              </nav>
  </header>
<main>
    <section>
        <form>
            <fieldset>
                <legend><h2>Cadastro de Usuários</h2></legend>
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" required>

                <label for="email">Número da Matrícula</label>
                <input type="number" id="Matricula" name="Matricula" required>

                <label for="login">Login</label>
                <input type="text" id="login" name="login" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required>

                <label for="perfil">Perfil</label>
                <select id="perfil" name="perfil" required>
                    <option value="administrador">Administrador</option>
                    <option value="secretaria">Secretaria</option>
                    <option value="consulta">Consulta</option>
                </select>

                <label for="status">Status</label>
                <input type="text" id="status" name="status" required>
            </fieldset>

            <button type="reset">Limpar</button>
            <button type="submit">Cadastrar</button>
        </form>
    </section>
</main>

<footer>
    <p>© 2026 Sistema de Gerenciamento Acadêmico. Todos os direitos reservados.</p>
</footer>
</body>
</html>
