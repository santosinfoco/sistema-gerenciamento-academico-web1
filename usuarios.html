<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lista de Usuários - Sistema Acadêmico</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Lista de Usuários</h1>

    <!-- Recipiente onde o JavaScript vai injetar os cartões dos usuários -->
    <div id="lista-usuarios" class="lista-grid"></div>

    <!-- Scripts necessários -->
    <script src="js/dados.js"></script>
    <script src="js/app.js"></script>
</body>
</html>



<section>
    <h2>Cadastrar Novo Usuário</h2>
    <form id="form-usuario">
        <input type="text" id="nome-usuario" placeholder="Nome Completo" required>
        <input type="email" id="email-usuario" placeholder="E-mail" required>
        <select id="perfil-usuario">
            <option value="Administrador">Administrador</option>
            <option value="Professor">Professor</option>
            <option value="Atendimento">Atendimento</option>
        </select>
        <button type="submit">Adicionar Usuário</button>
    </form>
</section>

<hr>

<div id="lista-usuarios" class="lista-grid"></div>


<script src="js/dados.js"></script>
<script src="js/app.js"></script>
